<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>listnr</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img class="mark" src="icons/logo.png" alt="" />
        <span>listnr</span>
      </div>
      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Checking server…</span>
      </div>
    </header>

    <section class="tile">
      <p class="lede">Reads the page you are on, without leaving it.</p>
      <button class="read" id="read-page" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8.5 5.2c0-.8.9-1.3 1.6-.9l9 6.8c.6.4.6 1.4 0 1.8l-9 6.8c-.7.4-1.6-.1-1.6-.9V5.2Z" />
        </svg>
        <span id="read-label">Read this page</span>
      </button>
      <p class="error" id="error" role="alert" hidden></p>
      <p class="note" id="server-note" hidden>Start the local server with <code>docker compose up -d</code>.</p>
    </section>

    <section class="tile settings" aria-label="Playback settings">
      <div class="section-title">
        <span>playback</span>
        <button class="reset" id="reset" type="button">Reset</button>
      </div>

      <label class="select-row" for="voice">
        <span>Voice</span>
        <select id="voice"></select>
      </label>

      <div class="row">
        <label for="rate">Speed</label>
        <output id="rate-value" for="rate">1×</output>
      </div>
      <input id="rate" type="range" min="0.5" max="3" step="0.05" />

      <div class="row">
        <label for="volume">Volume</label>
        <output id="volume-value" for="volume">100%</output>
      </div>
      <input id="volume" type="range" min="0" max="1" step="0.05" />

      <div class="row">
        <label for="sentence-gap">Sentence pause</label>
        <output id="sentence-gap-value" for="sentence-gap">160 ms</output>
      </div>
      <input id="sentence-gap" type="range" min="0" max="600" step="20" />

      <div class="row">
        <label for="paragraph-gap">Paragraph pause</label>
        <output id="paragraph-gap-value" for="paragraph-gap">600 ms</output>
      </div>
      <input id="paragraph-gap" type="range" min="0" max="1500" step="50" />

      <label class="check" for="follow">
        <input id="follow" type="checkbox" />
        <span>Follow the highlighted sentence</span>
      </label>

      <label class="check" for="show-pill">
        <input id="show-pill" type="checkbox" />
        <span>Show the listen bar on pages</span>
      </label>

      <label class="select-row" for="theme" style="margin-top: 14px; margin-bottom: 0;">
        <span>Appearance</span>
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </section>

    <footer class="foot">
      <span>Applies to every page.</span>
      <span class="kbd">⌥L</span>
    </footer>
  <script src="popup.js"></script>
  </body>
</html>
